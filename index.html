<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Agent · Czechitas</title>
<style>
  :root {
    --cream: #fdfaf5;
    --fg: #1a1814;
    --accent: #d4452f;
    --muted: #8a8478;
    --border: #e8e1d4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--fg);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { min-height: 100vh; padding: 20px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 36px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
  .rail { display: flex; flex-direction: column; gap: 14px; }
  .panel { background: #f4ecdb; border: 1px solid var(--border); border-radius: 4px; padding: 14px; }
  .panel h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--muted); font-weight: 600; }
  .scenarios button {
    display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px;
    background: var(--cream); border: 1px solid var(--border); border-radius: 3px;
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .scenarios button.active { background: var(--accent); color: var(--cream); border-color: var(--accent); }
  .scenarios button:hover:not(.active) { border-color: var(--accent); }
  .toggle-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
  .toggle-row label { flex: 1; cursor: pointer; }
  .toggle-row input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }
  .stage-wrap { background: #2a2520; border-radius: 4px; padding: 16px; }
  canvas#stage { display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    width: 100%; height: auto; max-width: 1440px; background: #000; }
  .log {
    background: #1a1814; color: #e8d8b8; padding: 12px; margin-top: 12px;
    font-family: var(--mono); font-size: 11px; border-radius: 4px;
    height: 140px; overflow-y: auto;
  }
  .log .line { padding: 2px 0; }
  .log .line.warn { color: #f4c674; }
  .log .line.fail { color: #f4847a; }
  .log .line.ok { color: #92d18a; }
  .log .line.skill { color: #b39df0; }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
  .controls button {
    background: var(--accent); color: var(--cream); border: none; padding: 8px 16px;
    border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  .controls button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .credit { font-size: 11px; color: var(--muted); margin-top: 12px; text-align: center; }
  .credit a { color: var(--muted); }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pixel Agent</h1>
  <div class="sub">jak vypadá smyčka agent → skill → MCP → DB → dashboard, když ji vidíte</div>

  <div class="layout">
    <div class="rail">
      <div class="panel scenarios">
        <h3>Scénář</h3>
        <button data-scenario="A" class="active">Top 10 zemí</button>
        <button data-scenario="B">Zkontroluj SQL</button>
        <button data-scenario="C">Smaž TEROR2_OLD</button>
      </div>
      <div class="panel">
        <h3>Skill rules</h3>
        <div id="rule-toggles"></div>
      </div>
      <div class="panel">
        <h3>Layers</h3>
        <div class="toggle-row">
          <input type="checkbox" id="t-skill" checked>
          <label for="t-skill">Skill loaded</label>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="t-mcp" checked>
          <label for="t-mcp">MCP server</label>
        </div>
        <div class="toggle-row">
          <input type="checkbox" id="t-evals" checked>
          <label for="t-evals">Evals</label>
        </div>
      </div>
    </div>

    <div>
      <div class="stage-wrap">
        <canvas id="stage" width="480" height="280"></canvas>
      </div>
      <div id="log" class="log"><div class="line">[idle] click "Run scenario" to start</div></div>
      <div class="controls">
        <button id="btn-run">Run scenario</button>
        <button id="btn-reset" class="ghost">Reset</button>
      </div>
      <div class="credit">
        Sprites: <a href="https://arlantr.itch.io/metrocity">MetroCity by BK.A4</a> · Office layout:
        <a href="https://github.com/thx0701/openclaw-virtual-office">openclaw-virtual-office (MIT)</a>
        · Sibling tools:
        <a href="https://ishalkin.github.io/czechitas-stack-trace/">Stack Trace</a> ·
        <a href="https://ishalkin.github.io/czechitas-skill-builder/">Skill Builder</a>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════
 * ASSET LOADING
 * ═══════════════════════════════════════════════════════════════════ */

const ASSETS = {
  bg: "assets/office/generated-office.png",
  juliaIdle: "assets/julia/Julia-Idle.png",
  juliaForward: "assets/julia/Julia_walk_Foward.png",
  juliaLeft: "assets/julia/Julia_walk_Left.png",
  juliaRight: "assets/julia/Julia_walk_Rigth.png",
  juliaUp: "assets/julia/Julia_walk_Up.png",
  juliaPC: "assets/julia/Julia_PC.png",
  chestClosed: "assets/office/chest-closed.png",
  chestOpen: "assets/office/chest-open.png",
};

const images = {};
function loadAll() {
  return Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { images[k] = img; res(); };
    img.onerror = () => { console.warn("failed:", src); res(); }; // continue even on missing assets
    img.src = src;
  })));
}

/* ═══════════════════════════════════════════════════════════════════
 * STATIONS (5 fixed positions on the office floor)
 * canvas is 480×280; place stations along sensible spots
 * ═══════════════════════════════════════════════════════════════════ */

// Open floor strip along bottom (y≈230) avoids writing-table at center
const STATIONS = {
  inbox:  { x: 70,  y: 235, label: "INBOX" },
  skill:  { x: 165, y: 235, label: "SKILL" },
  mcp:    { x: 245, y: 235, label: "MCP" },
  db:     { x: 335, y: 235, label: "DB" },
  board:  { x: 425, y: 235, label: "BOARD" },
  start:  { x: 245, y: 260, label: "" },
};

/* ═══════════════════════════════════════════════════════════════════
 * SPRITE CONFIG (Julia frames are 32×40 each, 4 frames per row)
 * ═══════════════════════════════════════════════════════════════════ */

const SPRITE_W = 32;
const SPRITE_H = 40;
const FRAMES = 4;

/* ═══════════════════════════════════════════════════════════════════
 * STATE
 * ═══════════════════════════════════════════════════════════════════ */

const state = {
  scenario: "A",
  rules: {
    rejectOld: true,
    neverInvent: true,
    refuseDrop: true,
    preferCountry: true,
  },
  skillOn: true,
  mcpOn: true,
  evalsOn: true,

  agent: {
    x: STATIONS.start.x,
    y: STATIONS.start.y,
    facing: "down",   // up | down | left | right
    moving: false,
    frame: 0,
    frameTime: 0,
    activity: "idle", // idle | walking | reading | tooling | drawing
  },

  steps: [],         // array of {fn, label} to play
  stepIdx: 0,
  stepCursor: null,  // current async target / handler
  running: false,

  bubble: null,      // { text, x, y, ttl }
  log: [],           // ['ok|warn|fail|skill|info', text]

  // MCP toolbox state
  mcpOpen: false,
  mcpTool: null,     // null | "list" | "describe" | "execute" | "blocked"

  // Skill checklist state — render above skill station while she's there
  skillCheck: null,  // null | { items: [{key, label, status: "pending"|"pass"|"fail"|"skip"}] }

  // Whiteboard chart state — bars 0..5 drawn one by one
  chartBars: 0,      // 0..5
  chartTone: "ok",   // "ok" | "warn" | "fail"
  chartShown: false,
};

/* ═══════════════════════════════════════════════════════════════════
 * RULE METADATA (used by skill panel)
 * ═══════════════════════════════════════════════════════════════════ */

const RULES = [
  { key: "rejectOld",     label: "rejectOld" },
  { key: "neverInvent",   label: "neverInvent" },
  { key: "refuseDrop",    label: "refuseDrop" },
  { key: "preferCountry", label: "preferCountry" },
];

/* ═══════════════════════════════════════════════════════════════════
 * RENDERING
 * ═══════════════════════════════════════════════════════════════════ */

const cnv = document.getElementById("stage");
const ctx = cnv.getContext("2d");
ctx.imageSmoothingEnabled = false;

function draw() {
  ctx.clearRect(0, 0, cnv.width, cnv.height);

  // background office
  if (images.bg) {
    ctx.drawImage(images.bg, 0, 0, cnv.width, cnv.height);
  } else {
    ctx.fillStyle = "#3a2f25";
    ctx.fillRect(0, 0, cnv.width, cnv.height);
  }

  // station markers + labels
  ctx.font = "bold 7px ui-monospace, monospace";
  ctx.textAlign = "center";
  for (const [k, s] of Object.entries(STATIONS)) {
    if (k === "start") continue;
    // soft cream pill behind label
    const w = ctx.measureText(s.label).width + 4;
    ctx.fillStyle = "rgba(253, 250, 245, 0.92)";
    ctx.fillRect(s.x - w / 2, s.y + 5, w, 9);
    ctx.fillStyle = "#1a1814";
    ctx.fillText(s.label, s.x, s.y + 12);
    // marker dot
    ctx.fillStyle = "#d4452f";
    ctx.fillRect(s.x - 1, s.y - 1, 3, 3);
  }
  ctx.textAlign = "start";

  // MCP chest at MCP station (overrides marker visually)
  drawMcpChest();

  // Whiteboard chart at BOARD station
  drawWhiteboard();

  // agent sprite
  drawAgent();

  // overlays anchored to agent / station
  if (state.skillCheck)  drawSkillChecklist();
  if (state.mcpOpen)     drawMcpToolPanel();

  // speech bubble (drawn last so it overlays everything)
  if (state.bubble) drawBubble(state.bubble);
}

function drawMcpChest() {
  const s = STATIONS.mcp;
  const sheet = state.mcpOpen ? images.chestOpen : images.chestClosed;
  if (!sheet) return;
  const w = 18, h = 18;
  ctx.drawImage(sheet, 0, 0, sheet.width, sheet.height,
    Math.round(s.x - w / 2), Math.round(s.y - h - 1), w, h);
}

function drawWhiteboard() {
  const s = STATIONS.board;
  const w = 36, h = 24;
  const bx = Math.round(s.x - w / 2);
  const by = Math.round(s.y - h - 4);
  // board
  ctx.fillStyle = "#fdfaf5";
  ctx.fillRect(bx, by, w, h);
  ctx.fillStyle = "#1a1814";
  ctx.fillRect(bx, by, w, 1);
  ctx.fillRect(bx, by + h - 1, w, 1);
  ctx.fillRect(bx, by, 1, h);
  ctx.fillRect(bx + w - 1, by, 1, h);
  // legs
  ctx.fillStyle = "#5a4a30";
  ctx.fillRect(bx + 4, by + h, 2, 4);
  ctx.fillRect(bx + w - 6, by + h, 2, 4);

  // Bars
  const colors = { ok: "#d4452f", warn: "#d8a93a", fail: "#7a3030" };
  const bar = colors[state.chartTone] || colors.ok;
  for (let i = 0; i < state.chartBars; i++) {
    const bw = 5;
    const bx2 = bx + 3 + i * 6;
    const bh = 4 + i * 3;
    const by2 = by + h - 3 - bh;
    ctx.fillStyle = bar;
    ctx.fillRect(bx2, by2, bw, bh);
  }
}

function drawSkillChecklist() {
  const items = state.skillCheck.items;
  const w = 80, h = 12 + items.length * 10;
  // float above SKILL station
  const sx = STATIONS.skill.x;
  const sy = STATIONS.skill.y - SPRITE_H - h - 6;
  const bx = Math.round(sx - w / 2);
  const by = Math.round(sy);

  // paper background
  ctx.fillStyle = "#fdfaf5";
  ctx.fillRect(bx, by, w, h);
  ctx.strokeStyle = "#1a1814";
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, h - 1);

  // header
  ctx.fillStyle = "#1a1814";
  ctx.font = "bold 7px ui-monospace, monospace";
  ctx.textAlign = "left";
  ctx.fillText("SKILL.md", bx + 4, by + 8);

  items.forEach((it, i) => {
    const lineY = by + 18 + i * 10;
    // checkbox
    ctx.strokeStyle = "#1a1814";
    ctx.strokeRect(bx + 4 + 0.5, lineY - 6 + 0.5, 6, 6);
    if (it.status === "pass") {
      ctx.fillStyle = "#3a7a3a";
      ctx.fillRect(bx + 5, lineY - 4, 4, 1);
      ctx.fillRect(bx + 6, lineY - 3, 4, 1);
    } else if (it.status === "fail") {
      ctx.fillStyle = "#a83020";
      ctx.fillRect(bx + 5, lineY - 5, 1, 4);
      ctx.fillRect(bx + 6, lineY - 5, 1, 4);
      ctx.fillRect(bx + 7, lineY - 5, 1, 4);
      ctx.fillRect(bx + 8, lineY - 5, 1, 4);
    } else if (it.status === "skip") {
      ctx.fillStyle = "#888";
      ctx.fillRect(bx + 5, lineY - 4, 4, 1);
    }
    // label
    ctx.fillStyle = it.status === "skip" ? "#888" : "#1a1814";
    ctx.fillText(it.label, bx + 14, lineY - 1);
  });
  ctx.textAlign = "start";
}

function drawMcpToolPanel() {
  const tools = [
    { key: "list",     icon: "list",     label: "list_tables" },
    { key: "describe", icon: "doc",      label: "describe_table" },
    { key: "execute",  icon: "wrench",   label: "execute_query" },
  ];
  const cell = 16;
  const w = tools.length * (cell + 4) + 4;
  const h = cell + 14;
  const sx = STATIONS.mcp.x;
  const sy = STATIONS.mcp.y - SPRITE_H - h - 6;
  const bx = Math.round(sx - w / 2);
  const by = Math.round(sy);

  // background
  ctx.fillStyle = "#1a1814";
  ctx.fillRect(bx, by, w, h);
  ctx.fillStyle = "#3a3530";
  ctx.fillRect(bx + 1, by + 1, w - 2, h - 2);

  // label
  ctx.fillStyle = "#e8d8b8";
  ctx.font = "bold 6px ui-monospace, monospace";
  ctx.textAlign = "left";
  ctx.fillText("MCP tools", bx + 4, by + 8);

  tools.forEach((t, i) => {
    const tx = bx + 4 + i * (cell + 4);
    const ty = by + 12;
    const active = state.mcpTool === t.key;
    // tile
    ctx.fillStyle = active ? "#d4452f" : "#1a1814";
    ctx.fillRect(tx, ty, cell, cell);
    // icon
    drawToolIcon(t.icon, tx, ty, cell, active ? "#fdfaf5" : "#a89a78");
  });
  // blocked banner
  if (state.mcpTool === "blocked") {
    ctx.fillStyle = "#d4452f";
    ctx.fillRect(bx, by + h - 4, w, 4);
    ctx.fillStyle = "#fdfaf5";
    ctx.font = "bold 5px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.fillText("BLOCKED BY SKILL", bx + w / 2, by + h - 0.5);
  }
  ctx.textAlign = "start";
}

function drawToolIcon(kind, x, y, cell, color) {
  ctx.fillStyle = color;
  if (kind === "list") {
    // magnifier: ring + handle
    ctx.fillRect(x + 4, y + 3, 6, 1);
    ctx.fillRect(x + 4, y + 8, 6, 1);
    ctx.fillRect(x + 3, y + 4, 1, 4);
    ctx.fillRect(x + 10, y + 4, 1, 4);
    ctx.fillRect(x + 11, y + 9, 1, 1);
    ctx.fillRect(x + 12, y + 10, 2, 2);
  } else if (kind === "doc") {
    // scroll
    ctx.fillRect(x + 4, y + 2, 8, 12);
    ctx.fillStyle = "#1a1814";
    ctx.fillRect(x + 6, y + 5, 4, 1);
    ctx.fillRect(x + 6, y + 7, 4, 1);
    ctx.fillRect(x + 6, y + 9, 4, 1);
    ctx.fillRect(x + 6, y + 11, 4, 1);
  } else if (kind === "wrench") {
    // wrench diagonal
    ctx.fillRect(x + 3, y + 3, 2, 2);
    ctx.fillRect(x + 5, y + 4, 2, 2);
    ctx.fillRect(x + 4, y + 4, 1, 1);
    ctx.fillRect(x + 6, y + 6, 6, 2);
    ctx.fillRect(x + 7, y + 5, 4, 1);
    ctx.fillRect(x + 11, y + 8, 1, 4);
    ctx.fillRect(x + 12, y + 9, 1, 3);
  }
}

function drawAgent() {
  const a = state.agent;
  let sheet;
  if (a.activity === "tooling" || a.activity === "drawing") {
    sheet = images.juliaPC || images.juliaIdle;
  } else if (a.activity === "reading" || a.activity === "idle" || !a.moving) {
    sheet = images.juliaIdle;
  } else if (a.facing === "up")    sheet = images.juliaUp;
    else if (a.facing === "left")  sheet = images.juliaLeft;
    else if (a.facing === "right") sheet = images.juliaRight;
    else                           sheet = images.juliaForward;

  if (!sheet) return; // assets still loading

  const sx = a.frame * SPRITE_W;
  const drawX = Math.round(a.x - SPRITE_W / 2);
  const drawY = Math.round(a.y - SPRITE_H + 4); // feet anchor
  ctx.drawImage(sheet, sx, 0, SPRITE_W, SPRITE_H, drawX, drawY, SPRITE_W, SPRITE_H);
}

function drawBubble(b) {
  ctx.font = "bold 8px ui-monospace, monospace";
  const padding = 4;
  const textW = ctx.measureText(b.text).width;
  const w = Math.ceil(textW) + padding * 2;
  const h = 14;
  const bx = Math.round(b.x - w / 2);
  const by = Math.round(b.y - SPRITE_H - h - 2);

  ctx.fillStyle = "#fdfaf5";
  ctx.fillRect(bx, by, w, h);
  ctx.strokeStyle = "#1a1814";
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, h - 1);
  // tail
  ctx.fillStyle = "#fdfaf5";
  ctx.fillRect(bx + Math.floor(w / 2) - 1, by + h, 3, 3);
  ctx.fillStyle = "#1a1814";
  ctx.fillText(b.text, bx + padding, by + h - 4);
}

/* ═══════════════════════════════════════════════════════════════════
 * ANIMATION LOOP
 * ═══════════════════════════════════════════════════════════════════ */

let lastT = performance.now();
function loop(t) {
  const dt = t - lastT;
  lastT = t;

  // animate frames
  const a = state.agent;
  a.frameTime += dt;
  if (a.frameTime > 140) {
    a.frameTime = 0;
    a.frame = (a.frame + 1) % FRAMES;
  }

  // bubble TTL
  if (state.bubble) {
    state.bubble.ttl -= dt;
    if (state.bubble.ttl <= 0) state.bubble = null;
  }

  // step cursor (movement updates)
  if (state.stepCursor) state.stepCursor(dt);

  draw();
  requestAnimationFrame(loop);
}

/* ═══════════════════════════════════════════════════════════════════
 * STEP PRIMITIVES — building blocks for scenarios
 * each returns a Promise that resolves when the step completes
 * ═══════════════════════════════════════════════════════════════════ */

function wait(ms) {
  return new Promise(res => setTimeout(res, ms));
}

function moveTo(targetX, targetY) {
  return new Promise(res => {
    const a = state.agent;
    const speed = 50; // px/s
    state.stepCursor = (dt) => {
      const dx = targetX - a.x;
      const dy = targetY - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 1) {
        a.moving = false;
        state.stepCursor = null;
        res();
        return;
      }
      a.moving = true;
      const step = (speed * dt) / 1000;
      const nx = dx / dist;
      const ny = dy / dist;
      a.x += nx * Math.min(step, dist);
      a.y += ny * Math.min(step, dist);
      // facing
      if (Math.abs(dx) > Math.abs(dy)) a.facing = dx > 0 ? "right" : "left";
      else                              a.facing = dy > 0 ? "down" : "up";
    };
  });
}

function gotoStation(key) {
  const s = STATIONS[key];
  return moveTo(s.x, s.y);
}

function say(text, ms = 1400) {
  state.bubble = { text, x: state.agent.x, y: state.agent.y, ttl: ms };
  // keep bubble pinned even when agent moves
  return wait(ms);
}

function activity(name, ms) {
  state.agent.activity = name;
  state.agent.moving = false;
  return wait(ms).then(() => { state.agent.activity = "idle"; });
}

// Skill checklist primitives
function showChecklist(items) {
  state.skillCheck = { items: items.map(i => ({ ...i, status: "pending" })) };
}
function setCheck(key, status) {
  if (!state.skillCheck) return;
  const it = state.skillCheck.items.find(i => i.key === key);
  if (it) it.status = status;
}
function hideChecklist() { state.skillCheck = null; }

// MCP toolbox primitives
function openMcp(tool = null) {
  state.mcpOpen = true;
  state.mcpTool = tool;
}
function closeMcp() {
  state.mcpOpen = false;
  state.mcpTool = null;
}

// Chart primitives
async function drawChartBar(tone) {
  state.chartTone = tone;
  state.chartShown = true;
  for (let i = 0; i < 5; i++) {
    state.chartBars = i + 1;
    await wait(180);
  }
}
function clearChart() {
  state.chartBars = 0;
  state.chartShown = false;
}

function logLine(kind, text) {
  state.log.push({ kind, text });
  renderLog();
}

function renderLog() {
  const el = document.getElementById("log");
  el.innerHTML = state.log.map(l => `<div class="line ${l.kind}">${escHtml(l.text)}</div>`).join("");
  el.scrollTop = el.scrollHeight;
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ═══════════════════════════════════════════════════════════════════
 * SCENARIOS — narrative coherent with stack-trace demo
 * ═══════════════════════════════════════════════════════════════════ */

async function runScenarioA() {
  // "Top 10 zemí" — succeeds, but evals catch dirty-data leak when preferCountry off
  const useClean = (state.skillOn && state.rules.preferCountry);

  await gotoStation("inbox");
  await say("nový prompt!", 1000);
  logLine("info", "PROMPT: Najdi top 10 zemí podle počtu útoků");
  await activity("reading", 800);

  if (state.skillOn) {
    await gotoStation("skill");
    showChecklist([
      { key: "rejectOld",     label: "rejectOld" },
      { key: "neverInvent",   label: "neverInvent" },
      { key: "refuseDrop",    label: "refuseDrop" },
      { key: "preferCountry", label: "preferCountry" },
    ]);
    logLine("skill", "SKILL loaded: sql-review.md (4 rules)");
    await wait(400);
    setCheck("rejectOld",   state.rules.rejectOld   ? "pass" : "skip");
    await wait(300);
    setCheck("neverInvent", state.rules.neverInvent ? "pass" : "skip");
    await wait(300);
    setCheck("refuseDrop",  state.rules.refuseDrop  ? "pass" : "skip");
    await wait(300);
    setCheck("preferCountry", state.rules.preferCountry ? "pass" : "skip");
    if (state.rules.preferCountry) {
      logLine("ok", "rule preferCountry → use COUNTRY (not COUNTRY_DIRTYDATA)");
    } else {
      logLine("warn", "preferCountry is OFF — agent picks first table");
    }
    await wait(700);
    hideChecklist();
  } else {
    logLine("warn", "skill is disabled — no pre-flight check");
  }

  if (!state.mcpOn) {
    await gotoStation("mcp");
    await say("nemůžu sáhnout na DB", 1400);
    logLine("fail", "MCP server is OFF — no execute_query tool");
    state.running = false; return;
  }

  await gotoStation("mcp");
  openMcp();
  await say("co potřebuju?", 1000);
  await wait(300); state.mcpTool = "list";     await wait(400);
  await wait(300); state.mcpTool = "describe"; await wait(400);
  await wait(300); state.mcpTool = "execute";
  await say("execute_query()", 900);
  logLine("info", "MCP: execute_query(SQL)");
  closeMcp();

  await gotoStation("db");
  const tableName = useClean ? "COUNTRY (204 rows)" : "COUNTRY_DIRTYDATA (408 rows)";
  await say("čtu " + tableName.split(" ")[0], 1200);
  logLine("info", "DB → joined " + tableName);
  await activity("tooling", 800);

  let chartTone = "ok";
  if (state.evalsOn) {
    if (useClean) {
      logLine("ok", "evals: count204 ✓  noDirtyLeak ✓  schemaMatch ✓");
    } else {
      logLine("warn", "evals: count408 ≠ 204 — DIRTYDATA leaked");
      chartTone = "warn";
    }
  } else if (!useClean) {
    logLine("fail", "evals OFF + DIRTYDATA — silent fail");
    chartTone = "fail";
  } else {
    logLine("info", "evals OFF (would have passed anyway)");
  }

  await gotoStation("board");
  await say("kreslím dashboard", 800);
  await drawChartBar(chartTone);
  if (chartTone === "ok")   logLine("ok",   "DASHBOARD: top 10 zemí — ready to ship");
  if (chartTone === "warn") logLine("warn", "DASHBOARD: ships with warning");
  if (chartTone === "fail") logLine("fail", "DASHBOARD: ships silently with bad numbers");

  await gotoStation("start");
  state.running = false;
}

async function runScenarioB() {
  // "Zkontroluj SQL" — broken query (TEROR2_OLD, YEAR, victims)
  await gotoStation("inbox");
  await say("zkontroluj SQL", 1000);
  logLine("info", "PROMPT: SELECT REGION, YEAR, SUM(victims) FROM TEROR2_OLD");
  await activity("reading", 800);

  if (state.skillOn) {
    await gotoStation("skill");
    showChecklist([
      { key: "rejectOld",     label: "rejectOld" },
      { key: "neverInvent",   label: "neverInvent" },
      { key: "refuseDrop",    label: "refuseDrop" },
      { key: "preferCountry", label: "preferCountry" },
    ]);
    logLine("skill", "SKILL loaded: sql-review.md");

    const blockedByOld    = state.rules.rejectOld;
    const blockedByInvent = state.rules.neverInvent;

    await wait(500);
    if (blockedByOld) {
      setCheck("rejectOld", "fail");
      logLine("fail", "rule rejectOld: TEROR2_OLD matches /(_OLD|_BACKUP|_LEGACY)/");
      await say("STOP — _OLD!", 1200);
      logLine("ok", "blocked before MCP — saved tokens & a wrong answer");
      await wait(800);
      hideChecklist();
      await gotoStation("start");
      state.running = false; return;
    }
    setCheck("rejectOld", "skip");
    await wait(400);
    if (blockedByInvent) {
      setCheck("neverInvent", "fail");
      logLine("fail", "rule neverInvent: column 'victims' not in schema");
      await say("STOP — bad column", 1200);
      logLine("ok", "blocked before MCP");
      await wait(800);
      hideChecklist();
      await gotoStation("start");
      state.running = false; return;
    }
    setCheck("neverInvent", "skip");
    setCheck("refuseDrop", "pass");
    setCheck("preferCountry", state.rules.preferCountry ? "pass" : "skip");
    logLine("warn", "rules rejectOld + neverInvent are OFF — passing through");
    await wait(700);
    hideChecklist();
  } else {
    logLine("warn", "skill is OFF — bad SQL will reach MCP");
  }

  if (!state.mcpOn) {
    await gotoStation("mcp");
    await say("MCP off", 1100);
    logLine("fail", "MCP server is OFF — agent gives up");
    state.running = false; return;
  }

  await gotoStation("mcp");
  openMcp("execute");
  await say("execute_query()", 900);
  closeMcp();
  await gotoStation("db");
  await say("ehm... chyba?", 1200);
  logLine("fail", "DB error: invalid identifier 'YEAR' — column does not exist");
  if (state.evalsOn) logLine("warn", "evals.schemaMatch ✗ — only fires AFTER the call");

  await gotoStation("start");
  state.running = false;
}

async function runScenarioC() {
  // "Smaž TEROR2_OLD" — DROP blocked by refuseDrop
  await gotoStation("inbox");
  await say("smaž TEROR2_OLD", 1000);
  logLine("info", "PROMPT: DROP TABLE TEROR2_OLD");
  await activity("reading", 800);

  if (state.skillOn && state.rules.refuseDrop) {
    await gotoStation("skill");
    showChecklist([
      { key: "rejectOld",     label: "rejectOld" },
      { key: "neverInvent",   label: "neverInvent" },
      { key: "refuseDrop",    label: "refuseDrop" },
      { key: "preferCountry", label: "preferCountry" },
    ]);
    await wait(400);
    setCheck("rejectOld", "skip"); await wait(300);
    setCheck("neverInvent", "skip"); await wait(300);
    setCheck("refuseDrop", "fail");
    logLine("fail", "rule refuseDrop: matches /(DROP|DELETE|UPDATE|TRUNCATE)/");
    await say("destruktivní VERB!", 1300);
    logLine("ok", "blocked — needs explicit human approval");
    await wait(800);
    hideChecklist();
    await gotoStation("start");
    state.running = false; return;
  }

  // refuseDrop off OR skill off → drop reaches DB
  if (state.skillOn) {
    await gotoStation("skill");
    showChecklist([
      { key: "rejectOld",     label: "rejectOld" },
      { key: "neverInvent",   label: "neverInvent" },
      { key: "refuseDrop",    label: "refuseDrop" },
      { key: "preferCountry", label: "preferCountry" },
    ]);
    setCheck("rejectOld", "skip"); await wait(300);
    setCheck("neverInvent", "skip"); await wait(300);
    setCheck("refuseDrop", "skip"); await wait(300);
    logLine("warn", "rule refuseDrop is OFF — destructive verb passes");
    await wait(700);
    hideChecklist();
  } else {
    logLine("warn", "skill is OFF — nothing pre-screens the SQL");
  }

  if (!state.mcpOn) {
    await gotoStation("mcp");
    await say("MCP off", 1100);
    logLine("ok", "MCP server is OFF — table survives by accident");
    state.running = false; return;
  }

  await gotoStation("mcp");
  openMcp("execute");
  await say("provádím DROP", 1100);
  closeMcp();
  await gotoStation("db");
  await say("...", 1100);
  await activity("tooling", 1000);
  logLine("fail", "TEROR2_OLD DROPPED — guardrail bypassed");
  if (state.evalsOn) logLine("fail", "evals.noDestructive ✗");

  await gotoStation("start");
  state.running = false;
}

const SCENARIOS = { A: runScenarioA, B: runScenarioB, C: runScenarioC };

/* ═══════════════════════════════════════════════════════════════════
 * UI WIRING
 * ═══════════════════════════════════════════════════════════════════ */

function buildRuleToggles() {
  const wrap = document.getElementById("rule-toggles");
  wrap.innerHTML = "";
  RULES.forEach(r => {
    const row = document.createElement("div");
    row.className = "toggle-row";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "r-" + r.key;
    cb.checked = state.rules[r.key];
    cb.addEventListener("change", () => { state.rules[r.key] = cb.checked; });
    const lab = document.createElement("label");
    lab.htmlFor = cb.id;
    lab.textContent = r.label;
    row.appendChild(cb);
    row.appendChild(lab);
    wrap.appendChild(row);
  });
}

function attachUI() {
  document.querySelectorAll(".scenarios button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".scenarios button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.scenario = btn.dataset.scenario;
    });
  });
  document.getElementById("t-skill").addEventListener("change", e => state.skillOn = e.target.checked);
  document.getElementById("t-mcp").addEventListener("change", e => state.mcpOn = e.target.checked);
  document.getElementById("t-evals").addEventListener("change", e => state.evalsOn = e.target.checked);
  document.getElementById("btn-run").addEventListener("click", runCurrent);
  document.getElementById("btn-reset").addEventListener("click", resetAll);
}

async function runCurrent() {
  if (state.running) return;
  state.running = true;
  state.log = [];
  renderLog();
  const fn = SCENARIOS[state.scenario];
  if (fn) await fn();
}

function resetAll() {
  state.running = false;
  state.stepCursor = null;
  state.bubble = null;
  state.agent.x = STATIONS.start.x;
  state.agent.y = STATIONS.start.y;
  state.agent.activity = "idle";
  state.agent.moving = false;
  state.log = [{ kind: "info", text: "[idle] click \"Run scenario\" to start" }];
  renderLog();
}

/* ═══════════════════════════════════════════════════════════════════
 * BOOT
 * ═══════════════════════════════════════════════════════════════════ */

(async function init() {
  buildRuleToggles();
  attachUI();
  await loadAll();
  requestAnimationFrame(loop);
})();
</script>
